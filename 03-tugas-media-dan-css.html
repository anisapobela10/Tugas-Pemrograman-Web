<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemutar Media Kuliah Responsif</title>
  <link rel="stylesheet" href="03-tugas-style.css">
</head>
<body>

  <!-- Kelas status tambahan 'media-card--featured' untuk uji spesifisitas -->
  <main class="media-card media-card--featured">
    <!-- Sampul Ilustrasi Gaya Art Direction -->
    <figure class="media-card__cover">
      <picture>
        <img src="gambar 1.jpeg" alt="Ilustrasi Sampul Pemrograman Web" class="media-card__image">
      </picture>
    </figure>

    <header class="media-card__header">
      <h1 class="media-card__title">Pemutar Media Kuliah: Pemrograman Web</h1>
      <p class="media-card__description">Pelajari konsep dasar media responsif, CSS BEM, dan spesifisitas pada modul praktikum 3.</p>
    </header>

    <!-- Konten Multimedia: Video & Audio -->
    <section class="media-card__body">
      <div class="media-card__video-wrapper">
        <video controls poster="gambar 2.jpeg" class="media-card__video">
          <!-- 2 Format Video Cadangan -->
          <source src="video.mp4" type="video/mp4">
          <source src="video 2.webm" type="video/webm">
          Browser Anda tidak mendukung elemen video.
        </video>
      </div>

      <div class="media-card__audio-wrapper">
        <audio controls class="media-card__audio">
          <!-- Menggunakan link audio MP3 yang valid -->
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
          Browser Anda tidak mendukung elemen audio.
        </audio>
      </div>
    </section>
  </main>

</body>
</html>
