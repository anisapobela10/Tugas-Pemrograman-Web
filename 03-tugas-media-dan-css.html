<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemutar Media Kuliah Responsif</title>
  <link rel="stylesheet" href="03-tugas-style.css">
</head>
<body>

  <!-- Menambahkan kelas status tambahan 'media-card-featured' untuk pengujian spesifisitas -->
  <main class="media-card media-card--featured">
    <!-- Sampul Ilustrasi Gaya Art Direction -->
    <figure class="media-card__cover">
      <picture>
        <source media="(min-width: 768px)" srcset="https://picsum.photos/id/180/800/400.webp" type="image/webp">
        <source srcset="https://picsum.photos/id/180/400/300.webp" type="image/webp">
        <img src="https://picsum.photos/id/180/800/400.jpg" alt="Ilustrasi Sampul Pemrograman Web" class="media-card__image">
      </picture>
    </figure>

    <header class="media-card__header">
      <h1 class="media-card__title">Pemutar Media Kuliah: Pemrograman Web</h1>
      <p class="media-card__description">Pelajari konsep dasar media responsif, CSS BEM, dan spesifisitas pada modul praktikum 3.</p>
    </header>

    <!-- Konten Multimedia: Video & Audio -->
    <section class="media-card__body">
      <div class="media-card__video-wrapper">
        <video controls poster="https://picsum.photos/id/0/600/338" class="media-card__video">
          <source src="video.mp4" type="video/mp4">
          Browser Anda tidak mendukung elemen video.
        </video>
      </div>

      <div class="media-card__audio-wrapper">
        <audio controls class="media-card__audio">
          <source src="video.mp4" type="audio/mpeg">
          Browser Anda tidak mendukung elemen audio.
        </audio>
      </div>
    </section>
  </main>

</body>
</html>
