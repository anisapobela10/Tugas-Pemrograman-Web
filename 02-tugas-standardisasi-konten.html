<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Publikasi Penelitian Dosen</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      color: #1a1a1a;
      line-height: 1.5;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 3px solid #17494d;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    header img {
      height: 64px;
      width: 64px;
      object-fit: contain;
    }
    h1 { margin: 0; font-size: 1.6rem; }
    header p { margin: 4px 0 0; color: #555; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 32px;
    }
    caption {
      font-weight: bold;
      text-align: left;
      margin-bottom: 8px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    thead th {
      background-color: #17494d;
      color: #fff;
    }
    tfoot td {
      background-color: #f0f0f0;
      font-weight: bold;
    }

    section { margin-bottom: 32px; }
    ol.bidang-keahlian > li { margin-bottom: 10px; }
    ol.bidang-keahlian ul { margin-top: 4px; }

    figure {
      border: 1px solid #ddd;
      padding: 16px;
      text-align: center;
      background: #fafafa;
    }
    figcaption {
      margin-top: 8px;
      font-style: italic;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo umm.jpg" alt="Logo Instansi">
    <div>
      <h1>Daftar Publikasi Penelitian Dosen</h1>
      <p>Program Studi Informatika &mdash; Fakultas Teknik, Universitas Muhammadiyah Malang</p>
    </div>
  </header>

  <section>
    

</body>
</html>
