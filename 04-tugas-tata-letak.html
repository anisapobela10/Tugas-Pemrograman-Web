<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Jurnal Ilmiah Multi-Kolom</title>

  <!-- Bootstrap 5 via CDN, wajib pakai integrity & crossorigin -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">

  <!-- CSS kustom kita, dimuat SETELAH Bootstrap supaya bisa menimpa -->
  <link rel="stylesheet" href="04-tugas-style.css">
</head>
<body>
      <!-- ======================= NAVIGASI (FLEXBOX MURNI) ======================= -->
  <header class="main-nav">
    <a href="#" class="main-nav__brand">Portal Jurnal Ilmiah</a>
    <nav>
      <ul class="main-nav__menu">
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Terbitan</a></li>
        <li><a href="#">Kategori</a></li>
        <li><a href="#">Tentang</a></li>
      </ul>
    </nav>
  </header>
    <!-- ======================= LAYOUT UTAMA (CSS GRID) ======================= -->
  <div class="journal-layout">

    <!-- KOLOM KIRI: SIDEBAR (200px) -->
    <aside class="journal-layout__sidebar">
      <p>Sidebar (isi menyusul)</p>
    </aside>

    <!-- KOLOM TENGAH: DAFTAR ARTIKEL (FLEKSIBEL) -->
    <main class="journal-layout__main">
      <h1 class="journal-layout__title">Terbitan Terbaru</h1>
      <p>Daftar artikel (isi menyusul)</p>
    </main>

    <!-- KOLOM KANAN: ASIDE (220px, mulai 992px) -->
    <aside class="journal-layout__aside">
      <p>Aside (isi menyusul)</p>
    </aside>

  </div>
</body>
</html>
